[package]
name = "ml_chess"
version = "0.1.0"
edition = "2024"

[dependencies]
ratatui    = "0.30.0"
crossterm  = "0.28"
shakmaty   = "0.27"
thiserror  = "2"
anyhow     = "1"
clap       = { version = "4", features = ["derive"] }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
rand       = "0.9"
rayon      = "1"
burn       = { version = "0.20.1", features = ["ndarray"] }

[features]
default = []
mcts    = []
train   = ["burn/train", "burn/autodiff", "burn/ndarray"]
